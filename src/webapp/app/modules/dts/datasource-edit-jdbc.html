<form class="card card-default form-horizontal" ng-submit="saveDatasource()">
    <div class="card-header">JDBC{{'dts.jdbc.type_datasource' | translate}} <span
            class="badge bg-secondary">{{datasource.type}}</span></div>
    <div class="card-body">
        <div class="form-group">
            <label class="control-label"
                   for="_id">{{'dts.jdbc.name' | translate}}（{{'dts.jdbc.only' | translate}}）*</label>
            <div class="form-control-wrapper">
                <input placeholder="{{'dts.jdbc.not_allow_chinese' | translate}} {{'dts.jdbc.space' | translate}}"
                       ng-readonly="editing" required ng-model="datasource.name"
                       class="form-control w-md" id="_id">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label" for="_jdbc_driver">JDBC{{'dts.jdbc.drive' | translate}}</label>
            <div class="form-control-wrapper">
                <select ng-model="selected.className" class="form-select w-md" id="_jdbc_driver"
                        ng-change="changeJdbcDriver()"
                        ng-options="driver.className as driver.dbName for driver in jdbcDrivers"></select>
                <p class="help-block">{{datasource.config.driver}}</p>
                <!--                <div ng-if="selected.className != 'other'">-->
                <!--                <input type="text" readonly ng-model="datasource.config.driver" class="form-control">-->
                <!--                </div>-->
                <!--                <div ng-if="selected.className == 'other'">-->
                <!--                    <input ng-model="datasource.config.driver" class="form-control">-->
                <!--                </div>-->
                <div class="mt-3">
                    <div ng-if="selectedDriver" class="input-group">
                        <div class="input-group-text"> JDBC URL{{'dts.jdbc.sample' | translate}}</div>
                        <input class="form-control" id="js-text2" readonly value="{{selectedDriver.urlTemplate}}">
                        <button type="button" ngclipboard=""
                                data-clipboard-target="#js-text2"
                                class="btn btn-default"><i
                                class="fa fa-copy"></i></button>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label" for="_jdbc_url">JDBC URL *</label>
            <div class="form-control-wrapper">
                <input required ng-model="datasource.config.url" class="form-control" id="_jdbc_url">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label">{{'dts.jdbc.verification_statement' | translate}}</label>
            <div class="form-control-wrapper">
                <input ng-model="datasource.config.validationQuery" class="form-control code">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label" for="input_jdbc_username">{{'dts.jdbc.username' | translate}}
                *</label>

            <div class="form-control-wrapper">
                <input required ng-model="datasource.config.username" class="form-control w-md"
                       id="input_jdbc_username">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label" for="input_jdbc_password">{{'dts.jdbc.password' | translate}}
                *</label>
            <div class="form-control-wrapper">
                <input required type="password" ng-model="datasource.config.password" class="form-control w-md"
                       id="input_jdbc_password">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label">{{'dts.jdbc.principal' | translate}} *</label>
            <div class="form-control-wrapper">
                <input required type="text" ng-model="datasource.config.manager" class="form-control w-md">
            </div>
        </div>

        <div class="form-group">
            <label class="control-label" for="_description">{{'dts.jdbc.desc' | translate}} *</label>
            <div class="form-control-wrapper">
                            <textarea required type="text" ng-model="datasource.description" class="form-control"
                                      id="_description"
                                      rows="3"></textarea>
            </div>
        </div>
        <!--</div>-->
        <!--<div class="card-footer">-->
        <div class="form-group">
            <div class="form-control-wrapper text-right">
                <button type="button" class="btn btn-outline-primary pull-left" ng-click="testConnectivity()">
                    {{'dts.jdbc.test_connectivity' | translate}}
                </button>
                <button type="submit" class="btn btn-primary opx-btn-ok">{{'dts.commons.save' | translate}}</button>
                <!--                <button type="button" class="btn btn-default opx-btn-cancel" ng-click="cancel()">{{'common.action.cancel' | translate}}-->
                <!--                </button>-->
            </div>
        </div>
    </div>
</form>
