<form class="card card-default form-horizontal" ng-submit="saveDatasource()">
    <div class="card-header">{{'dts.join.multiple_datasets' | translate}}</div>
    <div class="card-body">
        <div class="form-group">
            <label class="col-sm-2 control-label" for="input_name">name（{{'dts.join.only' | translate}}）</label>
            <div class="col-sm-10">
                <input type="text" ng-model="datasource.name" class="form-control" id="input_name">
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-10 col-sm-offset-2">
                <button class="btn btn-success">{{'dts.commons.save' | translate}}</button>
                <button type="button" class="btn btn-default" ng-click="cancel()">{{'common.action.cancel' | translate}}
                </button>
            </div>
        </div>
    </div>
</form>
