
<div class="modal-header">
    <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close" ng-click="cacResultExecuteVm.views.cancel()"><span aria-hidden="true"></span></button>
    <h4 class="modal-title"> {{'cac.index.history_rule' | translate}}</h4>
</div>
<div class="modal-body cac-history-find-dialog">
    <form name="ruleExecuteForm" class="form-horizontal">
        <div class="form-group">
            <label class="col-sm-2 control-label">{{'cac.common.rule' | translate}}</label>
            <div class="col-sm-10">
                <textarea type="textarea" class="form-control" placeholder="" required=""
                          ng-model="cacResultExecuteVm.views.ruleValue" row="3"></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">{{'cac.common.result' | translate}}</label>
            <div class="col-sm-10">
                <textarea type="textarea" class="form-control" placeholder=""
                          ng-model="cacResultExecuteVm.views.ruleValue" row="3"></textarea>
            </div>
        </div>
    </form>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="cacResultExecuteVm.views.cancel()">{{'common.entity.action.close' | translate}}
    </button>

    <button type="submit" class="btn btn-success" ng-click="cacResultExecuteVm.views.execute()"
            ng-disabled="ruleExecuteForm.$invalid">
        {{'cac.result.detail.re_execute' | translate}}
    </button>
</div>
