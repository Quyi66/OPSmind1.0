<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title mb-0">
                        <i class="fa fa-envelope"></i> 收件人管理测试页面 V2
                    </h4>
                </div>
                <div class="card-body">
                    <p class="text-muted">点击下面的按钮测试收件人管理功能：</p>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="btn-group-vertical w-100" role="group">
                                <button type="button" class="btn btn-outline-primary mb-2" ng-click="vm.testManage('template_001')">
                                    <i class="fa fa-envelope"></i> Linux系统巡检模版
                                </button>
                                <button type="button" class="btn btn-outline-info mb-2" ng-click="vm.testManage('template_002')">
                                    <i class="fa fa-envelope"></i> Windows服务器巡检模版
                                </button>
                                <button type="button" class="btn btn-outline-success mb-2" ng-click="vm.testManage('template_003')">
                                    <i class="fa fa-envelope"></i> 数据库巡检模版
                                </button>
                                <button type="button" class="btn btn-outline-warning mb-2" ng-click="vm.testManage('template_004')">
                                    <i class="fa fa-envelope"></i> 网络设备巡检模版
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card bg-light">
                                <div class="card-body">
                                    <h5 class="card-title">
                                        <i class="fa fa-info-circle text-info"></i> 功能说明
                                    </h5>
                                    <ul class="list-unstyled">
                                        <li class="mb-2">
                                            <i class="fa fa-plus text-success"></i>
                                            <strong>新增收件人</strong>：支持同时添加到多个模版
                                        </li>
                                        <li class="mb-2">
                                            <i class="fa fa-edit text-primary"></i>
                                            <strong>编辑收件人</strong>：支持同步修改到多个模版
                                        </li>
                                        <li class="mb-2">
                                            <i class="fa fa-trash text-danger"></i>
                                            <strong>删除收件人</strong>：支持从多个模版中删除
                                        </li>
                                        <li class="mb-2">
                                            <i class="fa fa-expand text-info"></i>
                                            <strong>模版扩展</strong>：默认收起，点击展开可选择其他模版
                                        </li>
                                        <li class="mb-2">
                                            <i class="fa fa-check text-success"></i>
                                            <strong>当前模版</strong>：默认选中，不可取消
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <hr>
                    
                    <div class="alert alert-info">
                        <i class="fa fa-lightbulb"></i>
                        <strong>提示：</strong>这是邮件配置V2的测试页面，用于验证收件人管理功能。实际使用时，请从邮件配置2页面的模版列表中点击"收件人列表"按钮进入。
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
