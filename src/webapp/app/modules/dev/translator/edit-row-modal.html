<div class="modal-header">
    <h4 class="modal-title">Edit Translation</h4>
    <button class="btn-close" ng-click="$ctrl.cancel()"></button>
</div>
<div class="modal-body">
    <form class="op-smartform form-vertical" ng-cloak>
        <div class="form-group" ng-if="$ctrl.isAdd || $ctrl.isRename">
            <label class="control-label">Key</label>
            <input name="key" class="form-control" ng-model="$ctrl.editData.key" required></input>
            <div class="alert alert-danger mt-3" ng-show="$ctrl.validation.error.pattern">
                Key 需至少包含一个 [.] 符号, 首个 [.] 符号前的字符将作为文件名, 且不能以 [.] 结尾
            </div>
            <div class="alert alert-danger mt-3" ng-show="$ctrl.validation.error.duplicated">
                该 Key 已存在
            </div>
            <div class="alert alert-primary mt-3" ng-show="$ctrl.validation.merge">
                Merge -- 将删除当前 Key 并将所有文件引用中的当前 Key 替换为输入的新 Key
            </div>
        </div>

        <div class="card text-white bg-warning" ng-show="$ctrl.validation.duplicatedTrans.length > 1">
            <div class="card-header">
                检索到主语言 {{$ctrl.primaryLang.title}} 存在重复项
            </div>
            <div class="list-group list-group-flush" ng-repeat="item in $ctrl.validation.duplicatedTrans track by $index">
                <button class="list-group-item text-left" 
                    ngclipboard ngclipboard-success="$ctrl.onCopySuccess();"
                    data-clipboard-text="{{item.key}}"
                    ng-class="{active: item.key === $ctrl.rawData.key}">
                    <i class="fa fa-copy"></i>
                    {{item.key}} : {{item.trans[$ctrl.primaryLang.code]}} : 文件引用: {{item.fileRefCount}} 数据库引用: {{item.dbRefCount}}
                </button>
            </div>
        </div>

        <div class="form-group" ng-repeat="lang in $ctrl.langs track by $index" ng-if="!$ctrl.isRename">
            <label class="control-label">{{lang.title}}</label>
            <div class="form-control-wrapper">
                <textarea class="form-control" ng-model="$ctrl.editData.trans[lang.code]" rows="5"></textarea>
                <button class="btn btn-primary opx-btn-ok mt-3" ng-click="$ctrl.translate()" ng-if="lang.primary">Translate</button>
            </div>
        </div>
    </form>
</div>
<div class="modal-footer">
    <button class="btn btn-primary opx-btn-ok" ng-show="!$ctrl.validation.merge" ng-click="$ctrl.save()" ng-disabled="$ctrl.isLoading || !$ctrl.validation.valid">Save</button>
    <button class="btn btn-primary opx-btn-ok" ng-show="$ctrl.validation.merge" ng-click="$ctrl.merge()" ng-disabled="$ctrl.isLoading || !$ctrl.validation.valid">Merge</button>
    <button class="btn btn-default opx-btn-cancel" ng-click="$ctrl.cancel()">Cancel</button>
</div>
