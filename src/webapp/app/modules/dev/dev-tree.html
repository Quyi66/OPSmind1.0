<style type="text/css">
    .tree-zone .card-body {
        max-height: 30rem;
        overflow: auto;
    }

    .info-zone .card-body {
        max-height: 10rem;
        overflow: auto;
    }
</style>
<div class="h-100 bg-white p-3">
    <div class="mt-3 mb-3 row info-zone">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <code>selectedItem</code>
                </div>
                <div class="card-body">
                    <pre class="p-3 bg-dark text-light">{{treeVm.selectedItem | json}}</pre>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <code>clickItem</code>
                </div>
                <div class="card-body">
                    <pre class="p-3 bg-dark text-light">{{treeVm.clickItem | json}}</pre>
                </div>
            </div>
        </div>
    </div>
    <div class="row tree-zone">
        <div class="col">
            <div class="card">
                <div class="card-header"></div>
                <div class="card-body">
                    <opx-tree tree-config="treeVm.treeConfig1" ng-model="treeVm.selectedItem"></opx-tree>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card">
                <div class="card-header"></div>
                <div class="card-body">
                    <opx-tree tree-config="treeVm.treeConfig2" ng-model="treeVm.selectedItem"></opx-tree>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card">
                <div class="card-header"></div>
                <div class="card-body">
                    <opx-tree tree-config="treeVm.treeConfig3" ng-model="treeVm.selectedItem"></opx-tree>
                </div>
            </div>
        </div>
    </div>

</div>
