<div class="modal-header">
    <h4 class="modal-title">{{'cmd.approve.info.detail' | translate}}</h4>
    <button type="button" class="btn-close" ng-click="$ctrl.cancel()">
    </button>
</div>
<div class="modal-body op-bold-label op-smartform">
    <div class="form-group">
        <label class="control-label">{{'common.entity.detail.status' | translate}}</label>
        <div class="form-control-wrapper"> {{$ctrl.command.status}}</div>
    </div>
    <div class="form-group">
        <label class="control-label">{{'cmd.approve.checkAt' | translate}}</label>
        <div class="form-control-wrapper"> {{$ctrl.command.checkAt}}</div>
    </div>
    <div class="form-group">
        <label class="control-label">{{'cmd.approve.reason' | translate}}</label>
        <div class="form-control-wrapper"> {{$ctrl.command.unapprovedReason}}</div>
    </div>
</div>
<div class="modal-footer d-flex flex-row-reverse">
    <button type="button" class="ms-auto btn btn-outline-primary" ng-click="$ctrl.cancel()">
        <i class="fa fa-chevron-left"></i> {{'common.action.back' | translate}}
    </button>
</div>
