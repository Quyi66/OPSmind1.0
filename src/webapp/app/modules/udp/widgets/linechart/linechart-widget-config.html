<uib-tabset class="tab-container">
    <uib-tab>
        <uib-tab-heading><i class='fa fa-database'></i> {{'udp.wc.tab.data'|translate}}</uib-tab-heading>
        <udp-widget-config-dataset props="uwProps.dataset" selected-ds="selectedDs"></udp-widget-config-dataset>
    </uib-tab>
    <uib-tab>
        <uib-tab-heading><i class='fa fa-list-ul'></i> {{'udp.wc.tab.field'|translate}}</uib-tab-heading>
        <udp-widget-config-chart-metrics uw-props="uwProps"
                                         axis-options="axisOptions"
                                         fields="selectedDs.fields"></udp-widget-config-chart-metrics>
    </uib-tab>
    <uib-tab>
        <uib-tab-heading><i class='fa fa-random'></i> {{'udp.wc.tab.interaction'|translate}}</uib-tab-heading>
        <udp-widget-config-interaction the-model="uwProps.interaction"
                                       options="{supports:'page'}"
                                       param-vars="{'${S}':'#{udp.w.echart.intx.var_series}','${X}':'#{udp.w.echart.intx.var_xvalue}','${Y}':'#{udp.w.echart.intx.var_yvalue}'}">
        </udp-widget-config-interaction>
    </uib-tab>
    <uib-tab>
        <uib-tab-heading><i class='fa fa-paint-brush'></i> {{'udp.wc.tab.style'|translate}}</uib-tab-heading>
        <udp-widget-config-display>
            <udp-widget-config-chart-display ng-model="uwProps.display"
                                             options="{enableVisualMap:false}"></udp-widget-config-chart-display>
            <div class="form-group">
                <label class="control-label col-sm-2">{{'udp.w.echart.display.zoom'|translate}}</label>
                <div class="col-sm-10">
                    <div class="checkbox checkbox-inline">
                        <input type="checkbox" ng-model="uwProps.display.rangeSlider" id="lwc-zoomx" ng-disabled="uwProps.enabledDoubleX"><label
                            for="lwc-zoomx">{{'udp.w.echart.display.zoom_x'|translate}}</label>
                    </div>
                    <div class="checkbox checkbox-inline">
                        <input type="checkbox" ng-model="uwProps.display.insideZoom"
                               ng-disabled="!uwProps.display.rangeSlider" id="lwc-inzoom"><label for="lwc-inzoom">{{'udp.w.echart.display.zoom_inside'|translate}}</label>
                    </div>
                    <div class="checkbox checkbox-inline">
                        <input type="checkbox" ng-model="uwProps.display.stack" id="lwc-stack"><label for="lwc-stack">{{'udp.w.echart.display.data_stack'|translate}}</label>
                    </div>
                </div>
            </div>
        </udp-widget-config-display>
    </uib-tab>
    <uib-tab>
        <uib-tab-heading><i class='fa fa-retweet'></i> {{'udp.wc.tab.condfmt'|translate}}</uib-tab-heading>
        <p>{{'udp.w.echart.line_condfmt.title'|translate}}</p>
        <udp-widget-linechart-format-yaxis the-model="uwProps" >
        </udp-widget-linechart-format-yaxis>

    </uib-tab>
    <uib-tab>
        <uib-tab-heading><i class='fa fa-bar-chart'></i> {{'udp.w.echart.elem.axis'|translate}}</uib-tab-heading>
        <udp-widget-config-chart-axes the-model="uwProps.display"
                                      fields="selectedDs.fields"
                                      uw-props="uwProps"></udp-widget-config-chart-axes>
    </uib-tab>
    <uib-tab heading="{{'udp.wc.tab.props'|translate}}">
        <udp-widget-props-viewer the-model="uwProps"></udp-widget-props-viewer>
    </uib-tab>
</uib-tabset>
