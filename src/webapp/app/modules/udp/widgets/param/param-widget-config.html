<uib-tabset class="tab-container">
    <uib-tab>
        <uib-tab-heading><i class='fa fa-cog'></i> {{'udp.wc.tab.basic'|translate}}</uib-tab-heading>
        <div class="form-group">
            <label class="control-label" op-help-info="udp.w.param.config.name_desc">{{'udp.w.param.config.name'|translate}}</label>
            <div class="form-control-wrapper">
                <input class="form-control op-w-md" ng-model="uwProps.name" id="f_name">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label"
                   op-help-info="udp.w.param.config.eventtorefresh_desc">{{'udp.w.param.config.eventtorefresh'|translate}}</label>
            <div class="form-control-wrapper">
                <input class="form-control op-w-md" ng-model="uwProps.eventtorefresh"/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label" op-help-info="udp.w.param.config.data_desc">{{'udp.w.param.config.data'|translate}}</label>
            <div class="form-control-wrapper">
                <udp-data-converter class="op-w-full" the-model="uwProps.data" options="{kinds:'js,yaml',varTypes:'pageparam'}"/>
            </div>
        </div>
        <div class="alert alert-info" ng-bind-html="'udp.w.param.config.desc'|translate">
        </div>
    </uib-tab>
    <uib-tab heading="{{'udp.wc.tab.props'|translate}}">
        <pre>{{currentValue}}</pre>
        <udp-widget-props-viewer the-model="uwProps"></udp-widget-props-viewer>
    </uib-tab>
</uib-tabset>
