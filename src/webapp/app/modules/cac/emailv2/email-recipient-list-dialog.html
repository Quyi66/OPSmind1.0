<div class="modal-header">
    <h4 class="modal-title">
        <i class="fa fa-envelope"></i>
        收件人列表
    </h4>
    <button type="button" class="close" ng-click="vm.cancel()" aria-label="Close">
        <span aria-hidden="true">&times;</span>
    </button>
</div>

<div class="modal-body">
    <!-- 工具栏 -->
    <div class="row mb-3">
        <div class="col-md-6">
            <button class="btn btn-primary btn-sm" ng-click="vm.addRecipient()">
                <i class="fa fa-plus"></i>
                新建
            </button>
            <button class="btn btn-default btn-sm" ng-click="vm.refresh()" ng-disabled="vm.loading">
                <i class="fa fa-refresh" ng-class="{'fa-spin': vm.loading}"></i>
                刷新
            </button>
        </div>
        <div class="col-md-6">
            <div class="input-group">
                <input type="text" class="form-control input-sm" 
                       placeholder="搜索收件人..." 
                       ng-model="vm.searchText">
                <span class="input-group-addon">
                    <i class="fa fa-search"></i>
                </span>
            </div>
        </div>
    </div>

    <!-- 加载状态 -->
    <div ng-if="vm.loading" class="text-center">
        <i class="fa fa-spinner fa-spin fa-2x"></i>
        <p>加载中...</p>
    </div>

    <!-- 收件人列表表格 -->
    <div ng-if="!vm.loading" class="table-responsive">
        <table class="table table-striped table-hover table-condensed">
            <thead>
                <tr>
                    <th>名称</th>
                    <th>邮箱</th>
                    <th>状态</th>
                    <th>备注</th>
                    <th width="120">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="recipient in vm.recipients" ng-if="vm.recipients.length > 0">
                    <td>
                        <strong>{{recipient.name}}</strong>
                    </td>
                    <td>
                        <span class="text-info">{{recipient.email}}</span>
                    </td>
                    <td>
                        <span class="label" 
                              ng-class="{'label-success': recipient.status === 'active', 'label-default': recipient.status !== 'active'}">
                            {{recipient.status === 'active' ? '正常' : '禁用'}}
                        </span>
                    </td>
                    <td>
                        <span class="text-muted">{{recipient.remark || '-'}}</span>
                    </td>
                    <td>
                        <div class="btn-group btn-group-xs" role="group">
                            <button class="btn btn-primary" 
                                    title="编辑"
                                    ng-click="vm.editRecipient(recipient)">
                                <i class="fa fa-edit"></i>
                                编辑
                            </button>
                            <button class="btn btn-danger" 
                                    title="删除"
                                    ng-click="vm.deleteRecipient(recipient)">
                                <i class="fa fa-trash"></i>
                                删除
                            </button>
                        </div>
                    </td>
                </tr>
                <tr ng-if="vm.recipients.length === 0">
                    <td colspan="5" class="text-center text-muted">
                        <i class="fa fa-inbox fa-2x"></i>
                        <p>暂无收件人数据</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 分页 -->
    <div ng-if="!vm.loading && vm.totalItems > vm.pageSize" class="text-center">
        <uib-pagination 
            total-items="vm.totalItems"
            ng-model="vm.currentPage"
            items-per-page="vm.pageSize"
            max-size="5"
            class="pagination-sm"
            boundary-links="true"
            rotate="false">
        </uib-pagination>
    </div>

    <!-- 统计信息 -->
    <div ng-if="!vm.loading" class="text-muted small">
        <span>共 {{vm.totalItems}} 条记录</span>
        <span ng-if="vm.recipients.length > 0">
            ，当前显示第 {{(vm.currentPage - 1) * vm.pageSize + 1}} - {{Math.min(vm.currentPage * vm.pageSize, vm.totalItems)}} 条
        </span>
    </div>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-default" ng-click="vm.close()">
        <i class="fa fa-check"></i>
        确定
    </button>
    <button type="button" class="btn btn-default" ng-click="vm.cancel()">
        <i class="fa fa-times"></i>
        取消
    </button>
</div>
