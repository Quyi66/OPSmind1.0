<div class="modal-header">
    <h4 class="modal-title">请先激活软件再使用</h4>
    <button type="button" class="btn-close" data-dismiss="modal" ng-click="$ctrl.cancel()">
    </button>
</div>
<div class="modal-body op-smartform">

    <div class="form-group">
        <div class="form-control-wrapper">
            <p class="help-block  text-danger">
                {{$ctrl.msg}}
            </p>
        </div>
    </div>
    <!-- <div class="form-group">
        <label class="control-label" op-help-info="请提供部署主机mac地址给厂商获取激活码">激活码</label>
        <div class="form-control-wrapper">
            <textarea class="form-control" ng-model="$ctrl.activationCode" rows="11"
                      style="resize: none;" required></textarea>
        </div>
    </div> -->

    <div class="form-group">
        <label class="control-label" op-help-info="请提供部署主机mac地址给厂商获取授权文件">授权文件</label>
        <div class="form-control-wrapper">
            <label class="btn btn-outline-primary">
                <input type="file" ngf-select ngf-max-size="$ctrl.ngf.maxSize" ngf-pattern="$ctrl.ngf.pattern"
                    ng-model="$ctrl.fileInfo.file" name="file" style="display:none;"">
                {{'gfs.basic.select_file' | translate}}
            </label>

            <div class="align-content-center ml-3">
                <strong>{{ $ctrl.fileInfo.file.name }}</strong>
            </div>

            <p class="help-block" style="margin-top: 1rem">
                {{'gfs.basic.file_max_size' | translate}}{{$ctrl.ngf.maxSize}}<strong>{{$ctrl.ngf.pattern}}</strong>。
            </p>
        </div>
    </div>
</div>


<div class="modal-footer">
    <button class="btn btn-primary opx-btn-ok" type="button" ng-click="$ctrl.register()">{{'common.action.ok'|translate}}</button>
    <button class="btn btn-default" type="button" ng-click="$ctrl.cancel()">{{'common.action.cancel'|translate}}</button>
</div>
