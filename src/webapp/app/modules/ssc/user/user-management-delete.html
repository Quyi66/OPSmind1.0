<div class="modal-header">
    <h4 class="modal-title" data-translate="entity.delete.title">Confirm delete operation</h4>
    <button type="button" class="btn-close" data-dismiss="modal" aria-hidden="true"
            ng-click="vm.clear()">
    </button>
</div>
<div class="modal-body">
    <!--        <jhi-alert-error></jhi-alert-error>-->
    <p data-translate="sys_userManagement.delete.question" translate-values="{login: '{{vm.user.login}}'}">Are you sure you want to delete this User?</p>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
        <span data-translate="common.action.cancel">Cancel</span>
    </button>
    <button type="button" class="btn btn-danger" ng-click="vm.confirmDelete()">
        <span data-translate="common.action.delete">Delete</span>
    </button>
</div>
