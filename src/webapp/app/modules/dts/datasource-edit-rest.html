<form class="card card-default" ng-submit="saveDatasource()">
    <div class="card-header">RESTful API{{'dts.datasource.title' | translate}}</div>
    <div class="card-body">
        <div class="form-group">
            <label class="control-label" for="input_name" op-help-info="{{'dts.rest.name_group_dataset' | translate}}">{{'dts.commons.name' | translate}}（{{'dts.commons.only' | translate}}）</label>
            <div class="">
                <input type="text" ng-model="datasource.name" class="form-control" id="input_name">
            </div>
        </div>
        <div class="form-group">
            <button class="btn btn-success">{{'dts.commons.save' | translate}}</button>
            <button type="button" class="btn btn-default" ng-click="cancel()">{{'common.action.cancel' | translate}}
            </button>
        </div>
    </div>
</form>
