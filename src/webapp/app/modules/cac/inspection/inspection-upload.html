<form  name="uploadForm" enctype="multipart/form-data">
    <div class="modal-header">
        <h4 class="modal-title" id="myUploadLabel" >{{'cac3.button.bulkImport' | translate}}</h4>
    </div>
    <div class="modal-body">
        <div class="row">
            <div class="form-group" >
                <div class="col-sm-9">
                    <div class="pull-right" ngf-select ng-model="file" name="file"  multiple>
                        <button style="padding-top: 2px;padding-bottom: 2px" type="button" class="btn btn-success"><i class="fa fa-plus"></i></button>
                    </div>
                    <div class="pull-right" style="width: 80%">
                        <span>{{'cac3.title.fileName' | translate}}:</span>
                        <input type="text" style="width: 90%" placeholder="{{'cac3.title.pleaseSelectFile' | translate}}"
                               name="name" ng-model="$ctrl.fileName.name" required/>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="$ctrl.cancel()" >
            <i class="fa fa-reply"></i>{{'common.action.back' | translate}}
        </button>
        <button type="button" ng-disabled="uploadForm.$invalid" class="btn btn-primary" ng-click="submit()">
            <i class="fa fa-file-import"></i>{{'common.action.import' | translate}}
        </button>
    </div>
</form>
