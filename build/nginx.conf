server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 启用gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 统一API代理 - 修改IP地址为实际的后端服务器
    location ~ ^/(oplus-portal|oplus-upload|oplus-njs|oplus-ws)/ {
        proxy_pass http://10.1.40.112;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # WebSocket支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # local-portal特殊处理（路径重写）
    location /local-portal/ {
        proxy_pass http://10.1.40.112/oplus-portal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 路径重写 - /oplus/base/ 映射到根目录
    location ^~ /oplus/base/ {
        rewrite ^/oplus/base/(.*)$ /$1 last;
    }

    # 路径重写 - /oplus-admin/ 映射到根目录
    location ^~ /oplus-admin/ {
        rewrite ^/oplus-admin/(.*)$ /$1 last;
    }

    # 根路径处理
    location / {
        try_files $uri $uri/ @fallback;
    }

    # SPA fallback - 对于找不到的文件，返回index.html
    location @fallback {
        rewrite ^.*$ /index.html last;
    }

    # 错误页面
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
