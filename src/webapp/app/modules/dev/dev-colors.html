<div class="wrapper">
    <div class="card mb-3">
        <div class="card-header">背景颜色</div>
        <div class="card-body d-flex flex-row flex-wrap">
            <div ng-repeat="theme in colorsVm.cardThemes" class="wrapper bg-{{theme.id}} opx-autocolor" style="width:20rem;">
                <a class="d-block">
                    <h4>{{theme.title}}</h4>
                    <div class="small text-muted">bg-{{theme.id}}</div>
                </a>
            </div>
        </div>
    </div>
    <div class="card mb-3">
        <div class="card-header">udp-theme-selector</div>
        <div class="card-body">
            <udp-theme-selector the-model="colorsVm.theTheme" customizable="true"></udp-theme-selector>
            <code>{{colorsVm.theTheme}}</code>
        </div>

    </div>
    <div class="card mb-3">
        <div class="card-header">udp-css-editor</div>
        <div class="card-body">
            <udp-css-editor the-model="colorsVm.theCss" customizable="true"></udp-css-editor>
            <code>{{colorsVm.theTheme}}</code>
        </div>

    </div>
    <div class="card mb-3">
        <div class="card-header">udp-color-picker
        </div>
        <div class="card-body">
            <div class="m-b">Color: <code>{{color || 'N/A'}}</code></div>
            <udp-color-picker ng-model="color"></udp-color-picker>
            <table class="table table-sm table-bordered">
                <tbody>
                <tr ng-repeat="row in colorsVm.paletteColors">
                    <td ng-repeat="color in row track by $index" style="background-color:{{color}};color:white;">{{color}}</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
