<div class="modal-header">
    <h4 class="modal-title">
        <span ng-if="vm.action === 'add'"><i class="fa fa-plus"></i> 新增收件人</span>
        <span ng-if="vm.action === 'edit'"><i class="fa fa-edit"></i> 编辑收件人</span>
        <span ng-if="vm.action === 'delete'"><i class="fa fa-trash"></i> 删除收件人</span>
    </h4>
    <button type="button" class="btn-close" ng-click="vm.cancel()"></button>
</div>

<div class="modal-body recipient-dialog">
    <!-- 收件人信息 -->
    <div ng-if="vm.action !== 'delete'">
        <div class="form-group">
            <label class="control-label">收件人邮箱 <span class="text-danger">*</span></label>
            <input type="email" class="form-control" ng-model="vm.recipientData.email" required>
        </div>
        
        <div class="form-group">
            <label class="control-label">收件人姓名</label>
            <input type="text" class="form-control" ng-model="vm.recipientData.name">
        </div>
    </div>
    
    <!-- 删除确认信息 -->
    <div ng-if="vm.action === 'delete'">
        <p>确定要删除收件人 <strong>{{vm.recipientData.email}}</strong> 吗？</p>
    </div>
    
    <!-- 模版扩展选择 -->
    <div class="form-group">
        <div class="d-flex align-items-center">
            <label class="control-label me-3">同步到其他模版</label>
            <button type="button" class="btn btn-sm btn-outline-secondary" ng-click="vm.toggleTemplateExpansion()">
                <i class="fa" ng-class="vm.isTemplateExpanded ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                <span ng-if="!vm.isTemplateExpanded">展开</span>
                <span ng-if="vm.isTemplateExpanded">收起</span>
            </button>
        </div>
        
        <!-- 模版选择列表 -->
        <div ng-if="vm.isTemplateExpanded" class="mt-3 template-expansion-panel">
            <div class="alert alert-info">
                <i class="fa fa-info-circle"></i>
                <small>选择要同步操作的模版，默认已选中当前模版</small>
            </div>
            
            <div class="template-selection-container" style="max-height: 200px; overflow-y: auto; border: 1px solid #ddd; padding: 10px;">
                <div ng-repeat="template in vm.templates" class="form-check">
                    <input type="checkbox" 
                           class="form-check-input" 
                           id="template_{{template.template_id}}"
                           ng-model="vm.selectedTemplates[template.template_id]"
                           ng-disabled="template.template_id === vm.currentTemplate.template_id">
                    <label class="form-check-label" for="template_{{template.template_id}}">
                        {{template.template_name}}
                        <span ng-if="template.template_id === vm.currentTemplate.template_id" class="badge badge-primary ms-2">当前模版</span>
                    </label>
                </div>
            </div>
            
            <div class="mt-2">
                <small class="text-muted">
                    <i class="fa fa-check-circle"></i> 已选择 {{vm.getSelectedTemplateCount()}} 个模版
                </small>
            </div>
        </div>
    </div>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-secondary" ng-click="vm.cancel()">
        <i class="fa fa-times"></i> 取消
    </button>
    <button type="button" class="btn btn-primary" ng-click="vm.save()" 
            ng-disabled="vm.action !== 'delete' && !vm.recipientData.email">
        <i class="fa fa-check"></i>
        <span ng-if="vm.action === 'add'">新增</span>
        <span ng-if="vm.action === 'edit'">保存</span>
        <span ng-if="vm.action === 'delete'">删除</span>
    </button>
</div>
