<div class="opx-layout-vflex" ui-view="dts_dataset_list">
    <nav class="navbar navbar-light">
        <div class="navbar-nav">
            <ol class="breadcrumb">
                <li class="breadcrumb-item active opx-navbar-title">{{'app.mgmt.dataset.title' | translate}}</li>
            </ol>
        </div>
        <div class="navbar-nav ms-auto">
            <a class="btn btn-primary opx-btn-flat" ui-sref="app.appman.dataset.create"> <i class="fa fa-plus"></i>
                {{'common.action.create' | translate}}
            </a>
        </div>
    </nav>
    <div class="opx-flex-fill">
        <dataset-list show-applet="false" applet-code="appMgmtDatasetsVm.appletCode" ui-view-url="'edit_dataset'"
                      create-state="'app.appman.dataset.create'"
                      edit-state="'app.appman.dataset.edit'"
                      dataset-state="'app.appman.dataset'" options="{enableEdit:true}"></dataset-list>
    </div>
</div>
