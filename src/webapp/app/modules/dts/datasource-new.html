<div ui-view="">
    <nav class="navbar navbar-light bg-light">
        <div class="navbar-nav">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a ng-click="ctrl.gotoState(ctrl.breadcrumbState)">{{'dts.datasource.data_service' | translate}}</a></li>
                <li class="breadcrumb-item active opx-navbar-title">
                    {{'dts.datasource.action.create_datasource' | translate}}
                </li>
            </ol>
        </div>
    </nav>
    <div class="p-3">
        <p>{{'dts.datasource.choose_dataset_type' | translate}}</p>
        <div class="row">
            <div class="col-sm-3 text-center" ng-repeat="ds in ::ctrl.dsTypeList track by $index">
                <a ng-click="ctrl.gotoState(ctrl.createState, {type:ds.type})" class="op-jumbo-link">
                    <div class="op-jumbo-link-icon" ng-class="ds.disabled?'bg-light':'bg-primary'">
                        <i class="fas {{::ds.icon}} fa-5x"></i>
                    </div>
                    <h4>{{::ds.label}}</h4></a>
            </div>
        </div>
    </div>
</div>
