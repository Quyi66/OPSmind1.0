<form class="card card-default form-horizontal" ng-submit="saveDatasource()">
    <div class="card-header">ElasticSearch {{'dts.datasource.title' | translate}}</div>
    <div class="card-body">
        <div class="form-group">
            <label class="col-sm-2 control-label" for="input_name">name（{{'dts.es.only' | translate}}）</label>
            <div class="col-sm-10">
                <input type="text" ng-model="datasource.name" class="form-control" id="input_name">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label" for="input_url">{{'dts.es.address' | translate}}</label>
            <div class="col-sm-10">
                <input type="url" class="form-control" id="input_url" ng-model="datasource.config.url">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label" for="input_query">{{'dts.es.test_statement' | translate}}</label>
            <div class="col-sm-10">
                <input type="text"   class="form-control" id="input_query" ng-model="datasource.config.query">
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-10 col-sm-offset-2">
                <button type="button" ng-click="testConnectivity()" class="btn btn-primary pull-right">{{'dts.es.test_connectivity' | translate}}</button>
                <button class="btn btn-success">{{'dts.commons.save' | translate}}</button>
                <button type="button" class="btn btn-default" ng-click="cancel()">{{'common.action.cancel'|translate}}</button>
            </div>
        </div>
    </div>
</form>
