<div class="mb-3" ng-if="$ctrl.batchIds.length > 1">
    <div class="btn-group">
        <button type="button" 
                class="btn btn-sm" 
                ng-repeat="batchId in $ctrl.batchIds" 
                ng-class="$ctrl.selectedBatchId === batchId ? 'btn-primary' : 'btn-outline-primary'" 
                ng-click="$ctrl.changeBatch(batchId)">
            {{batchId}}
        </button>
    </div>
</div>
<opx-datatable table-config="$ctrl.tableConfig">
    <div class="form-group">
        <div class="form-control-wrapper">
            <select ng-model="$ctrl.playFilter" class="form-select" ng-change="$ctrl.reload()"
                    ng-options="play.name as play.name for play in $ctrl.plays">
                <option value="" ng-if="$ctrl.plays.length>1">{{'common.term.all' | translate}}</option>
            </select>
        </div>
    </div>
</opx-datatable>
