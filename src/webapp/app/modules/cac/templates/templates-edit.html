<div class="opx-layout-vflex">
    <nav class="navbar navbar-light">
        <div class="navbar-nav">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a ui-sref="app.cac3.templates.list({display:true})">{{'cac3.navigation.patrol_item_list' | translate}}</a>
                </li>
                <li class="breadcrumb-item active opx-navbar-title">{{vm.views.templates.id == null ? ('cac3.title.newPatrolTemplate' | translate) : ('cac3.title.editPatrolTemplate' | translate)}}
                </li>
            </ol>
        </div>
        <div class="navbar-nav ms-auto" uaa-has-permission="cac:edit:*">
            <button type="button" ng-disabled="editForm.$invalid || vm.isSaving" ng-click="vm.save()"
                    class="btn btn-primary opx-btn-ok">{{'common.entity.action.save' | translate}}
            </button>
            <button type="button" class="btn btn-default opx-btn-cancel" ng-click="vm.clear()">
                {{'common.entity.action.back' | translate}}
            </button>
        </div>
    </nav>
    <div class="opx-flex-fill scroll-y p-3" uaa-has-permission="cac:edit:*" uaa-deny-message="{{'common.uaa.no_permission' | translate}}">
        <form name="editForm" role="form">
            <div class="form-group">
                <label class="control-label">{{'common.entity.detail.name' | translate}}<span class="text-danger">*</span></label>
                <div class="form-control-wrapper">
                    <input type="text" class="form-control"
                           ng-model="vm.views.templates.name" required>
                </div>
            </div>

            <div class="form-group">
                <label class="control-label">{{'common.entity.detail.description' | translate}}</label>
                <div class="form-control-wrapper">
                    <textarea type="text" class="form-control uneditable-input"
                              ng-model="vm.views.templates.description">
                    </textarea>
                </div>
            </div>

            <div class="form-group">
                <label class="control-label">{{'cac3.title.enableGlobalParameters' | translate}}</label>
                <div class="form-control">
                    <label class="radio-inline">
                        <input type="radio" name="overwrite" ng-value="0" ng-model="vm.views.templates.overwrite" >
                        <span>{{'cac3.title.yes' | translate}}</span>
                    </label>
                    <label class="radio-inline">
                        <input type="radio" name="overwrite" ng-value="1" ng-model="vm.views.templates.overwrite">
                        <span>{{'cac3.title.no' | translate}}</span>
                    </label>
                </div>
            </div>

            <div class="form-group" ng-if="vm.views.templates.overwrite == 0">
                <label class="control-label">{{'cac3.title.customParameterList' | translate}}</label>
                <div class="form-control-wrapper">
                    <input type="text" class="form-control"
                           ng-model="vm.views.templates.globalParameters" placeholder="key1=value1 key2=value2 ...">
                </div>
            </div>

            <div class="card-body mb-5" ng-repeat="item in vm.views.auditParams" style="border: 1px solid #ced4da;">
                <label class="control-label font-weight-bold text-left" style="width:4rem;"><i class="fa fa-laptop"></i> {{'common.entity.variable.host' | translate}}<span class="text-danger">*</span></label>
                <div class="form-control-wrapper">
                    <div class="w-full">
                        <div class="mt-3">
                            <acm-device-selector the-model="item.hosts" ci-types="'[auto]'" mcheck-type="'map'"></acm-device-selector>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-body mb-5" style="border: 1px solid #ced4da;" style="border: 1px solid #ced4da;">
                <label class="control-label font-weight-bold text-left" style="width:6rem;"><i class="fa fa-euro-sign"></i> {{'cac3.title.patrolInspectionItems' | translate}}<span class="text-danger">*</span></label>
                <div class="form-control-wrapper">
                    <div class="w-full">
                        <div class="mt-3">
                            <inspection-dynamic-selector the-model="vm.views.templates.threeCheckItemIds"></inspection-dynamic-selector>
                        </div>
                    </div>
                </div>
            </div>

        </form>
    </div>
</div>
