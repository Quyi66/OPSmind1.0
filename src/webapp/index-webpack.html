<!DOCTYPE html>
<html lang="zh-cn" ng-app="OplusApp">
<head>
    <meta charset="utf-8"/>
    <title id="oplusAppName">OPSmind</title>
    <meta name="description" content="OpsMind is Operation Plus"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
    <meta http-equiv="Access-Control-Allow-Origin" content="*">

    <link id="oplusAppIcon" rel="icon" type="image/png" href="content/images/logo-default.png"/>
    <link rel="apple-touch-icon" href="content/images/logo-default.png"/>
    
    <!-- 第三方库样式 - 必须手动引入的CSS -->
    <!-- 表格编辑器 -->
    <link rel="stylesheet" href="lib/luckysheet/dist/plugins/css/pluginsCss.css" />
    <link rel="stylesheet" href="lib/luckysheet/dist/plugins/plugins.css" />
    <link rel="stylesheet" href="lib/luckysheet/dist/css/luckysheet.css" />
    <link rel="stylesheet" href="lib/luckysheet/dist/assets/iconfont/iconfont.css" />

    <!-- 图标和字体 -->
    <link rel="stylesheet" href="content/css/fontawesome-pro.css" />

    <!-- 第三方组件样式 -->
    <link rel="stylesheet" href="node_modules/fullcalendar/dist/fullcalendar.css" />
    <link rel="stylesheet" href="node_modules/jquery-ui/themes/base/resizable.css" />
    <link rel="stylesheet" href="node_modules/angularjs-toaster/toaster.min.css" />
    <link rel="stylesheet" href="node_modules/animate.css/animate.min.css" />
    <link rel="stylesheet" href="node_modules/angular-loading-bar/build/loading-bar.css" />
    <link rel="stylesheet" href="node_modules/codemirror/lib/codemirror.css" />
    <link rel="stylesheet" href="node_modules/codemirror/addon/fold/foldgutter.css" />
    <link rel="stylesheet" href="node_modules/diff2html/dist/diff2html.css" />
    <link rel="stylesheet" href="node_modules/bootstrap-daterangepicker/daterangepicker.css" />
    <link rel="stylesheet" href="node_modules/select2/dist/css/select2.min.css" />
    <link rel="stylesheet" href="node_modules/jquery.fancytree/dist/skin-awesome/ui.fancytree.css" />
    <link rel="stylesheet" href="node_modules/jquery-contextmenu/dist/jquery.contextMenu.css" />

    <!-- 编辑器相关 -->
    <link rel="stylesheet" href="app/modules/commons/editor/codemirror/dialog.css" />
    <link rel="stylesheet" href="lib/json-editor/jsoneditor.min.css" />
    <link rel="stylesheet" href="lib/ng-password-meter/ng-password-meter.css" />
    <link rel="stylesheet" href="lib/mergely/mergely.css" />

    <!-- 应用样式 -->
    <link rel="stylesheet" href="content/css/oplus-commons.css" />
    <link rel="stylesheet" href="content/css/oplus-gfs.css" />
    <link rel="stylesheet" href="content/css/oplus-udp.css" />
    <link rel="stylesheet" href="content/css/oplus-dts.css" />
    <link rel="stylesheet" href="content/css/oplus-jao.css" />
    <link rel="stylesheet" href="content/css/oplus-cac.css" />
    <link rel="stylesheet" href="content/css/oplus-cm.css" />
    <link rel="stylesheet" href="content/css/oplus-search.css" />

    <!-- Flow模块样式 -->
    <link rel="stylesheet" href="app/modules/flow/dist/oplus-flow.css" />

    <!-- Webpack 将在这里自动注入构建的CSS文件 -->
</head>
<body ng-strict-di ng-cloak ng-controller="MainCtrl as $mainCtrl">
    <toaster-container toaster-options="$mainCtrl.toasterOptions"></toaster-container>
    <op-desktop
        ng-style="{'background-image':$mainCtrl.uiConfig.backgroundImage,'background-color':$mainCtrl.uiConfig.backgroundColor}"
        ng-if="!$root.$global.hideDesktop && !$root.$global.isAdminUI"></op-desktop>
    <div class="opx-layout-vflex">
        <div id="master-header" ui-view="navbar" ng-if="!$root.$global.hideHeader"></div>
        <div id="master-body" ui-view="content" class="opx-flex-fill scroll-y js-spa-body bg-white" style="z-index: 0"
            ng-class="{'hidden':$root.$global.hideMasterContent}">
            <!-- 定制版本：移除加载动画，用于iframe嵌入第三方系统 -->
        </div>
    </div>

<!-- 定制版本：移除全局加载指示器，用于iframe嵌入第三方系统 -->

<!-- Global dialogs and overlays -->
<div id="opx-dialogs"></div>

<!-- 全局初始化脚本 -->
<script type="text/javascript">
    // 全局初始化对象
    window["@oplus/init"] = {
        timestamp: '<%= BUILD_TIMESTAMP %>',
        version: '<%= VERSION %>',
        profiles: [] // 将由 profiles.js 填充
    };
    
    // 全局配置
    window["@oplus/config"] = {
        debug: '<%= process.env.NODE_ENV %>' === 'development',
        version: '<%= VERSION %>',
        buildTime: '<%= BUILD_TIMESTAMP %>'
    };
</script>

<!-- Webpack 将在这里自动注入 JS 文件 -->

</body>
</html>
