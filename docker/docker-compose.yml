# /opt/oplus/docker-compose.yml — 230 正式栈（权威文件，逆向自运行态）
# 项目名 oplus-backend；工作目录 /opt/oplus（与当前运行容器的 com.docker.compose.* 标签一致）
# 仅重建前端时使用：cd /opt/oplus && docker compose up -d --no-deps oplus-web
# 组成：
#   - oplus-be-db  : 独立 MariaDB（数据卷 oplus-be-db-data，宿主 3306）
#   - oplus-backend: 后端镜像 oplus:20260722-1838-dtsfix-jdk21
#                    （容器内 /opt/oplus/start.sh all 一次性拉起 nginx+redis+portal/svs/dts/jobadm 四个 java 进程）
#   - oplus-web    : 前端 oplus-web:1.1.33，指向 oplus-backend，占用宿主 80/443

name: oplus-backend

services:
  oplus-be-db:
    image: mariadb:latest
    container_name: oplus-be-db
    ports:
      - "3306:3306"
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "1qaz@WSX"
    volumes:
      - oplus-be-db-data:/var/lib/mysql
      - ./conf/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - oplus-be
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  oplus-backend:
    image: oplus:20260722-1838-dtsfix-jdk21
    container_name: oplus-backend
    restart: unless-stopped
    depends_on:
      oplus-be-db:
        condition: service_healthy
    cpus: 4
    mem_limit: 6g
    ports:
      - "8080:80"      # 后端 Nginx
      - "8001:8001"    # oplus-portal
      - "8021:8021"    # oplus-dts
      - "8081:8081"    # oplus-svs
      - "8099:8099"    # oplus-jobadm 管理端(web)
      - "8989:8989"    # oplus-jobadm xxl-job 执行器端口
    volumes:
      - /opt/oplus/oplus-backend/conf/oplus-env.yml:/opt/oplus/.oplus-env.yml
      - oplus-be-logs:/var/log/oplus
    networks:
      - oplus-be

  oplus-web:
    image: oplus-web:1.1.34
    container_name: oplus-web
    restart: unless-stopped
    depends_on:
      - oplus-backend
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    environment:
      - BACKEND_URL=http://oplus-backend:80
      - BACKEND_HOST=oplus-backend
      - BACKEND_PORT=80
    ports:
      - "80:80"        # 前端公网入口(HTTP)
      - "443:443"      # 前端公网入口(HTTPS)
    volumes:
      - ./oplus.cert:/etc/nginx/ssl/server.crt:ro
      - ./oplus.key:/etc/nginx/ssl/server.key:ro
    networks:
      - oplus-be

networks:
  oplus-be:
    driver: bridge

volumes:
  oplus-be-db-data:
    driver: local
  oplus-be-logs:
    driver: local
