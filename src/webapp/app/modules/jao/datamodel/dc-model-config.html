<form class="op-smartform form-vertical">
    <div class="form-group">
        <label class="control-label">{{'jao.dc.detail.code' | translate}}</label>
        <div class="form-control-wrapper">
            <input ng-disabled="$ctrl.viewMode==='view' || $ctrl.viewMode==='edit'" type="text" ng-model="$ctrl.modelConfig.code"
                   class="form-control">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label">{{'common.entity.detail.name' | translate}}</label>
        <div class="form-control-wrapper">
            <input ng-disabled="$ctrl.viewMode==='view'" type="text" ng-model="$ctrl.modelConfig.title"
                   class="form-control">
        </div>
    </div>
<!--    <div class="form-group">-->
<!--        <label class="control-label">{{'jao.dc.detail.owner_application' | translate}}</label>-->
<!--        <div class="form-control-wrapper">-->
<!--            <select ng-disabled="$ctrl.viewMode==='view'" class="form-select w-sm" style="width: 16rem;"-->
<!--                    ng-model="$ctrl.modelConfig.appletCode"-->
<!--                    ng-options="app.name as app.title for app in $ctrl.apps">-->
<!--            </select>-->
<!--        </div>-->
<!--    </div>-->
    <div class="form-group">
        <label class="control-label">{{'jao.dc.detail.mode' | translate}}</label>
        <div class="form-control-wrapper">
            <div class="opx-check-group opx-secondary btn-group">
                <input ng-repeat-start="option in dcDataTypes track by $index" type="radio" name="mc_datamode"
                       value="{{option.value}}"
                       ng-model="$ctrl.modelConfig.dataMode"
                       id="mc_datamode_{{$index}}">
                <label ng-repeat-end for="mc_datamode_{{$index}}">{{option.label}}</label>
            </div>
            <!--            <select class="form-select op-w-sm"-->
            <!--                    ng-model="$ctrl.modelConfig.dataMode"-->
            <!--                    ng-disabled="$ctrl.viewMode==='view'">-->
            <!--                <option ng-repeat="option in dcDataTypes" value="{{option.value}}">-->
            <!--                    {{option.label}}-->
            <!--                </option>-->
            <!--            </select>-->
        </div>
    </div>
    <fieldset class="mt-3" ng-disabled="$ctrl.viewMode==='view'">
        <legend>{{'jao.dc.detail.attr' | translate}}</legend>
        <umd-config-attrs ng-model="$ctrl.modelConfig.attrs" class="d-block"></umd-config-attrs>
    </fieldset>

    <div class="op-form-actions">
        <button type="button" class="btn btn-primary opx-btn-ok" ng-click="$ctrl.save($ctrl.modelConfig)"
                ng-show="$ctrl.viewMode==='edit' || $ctrl.viewMode==='create'">{{'common.entity.action.save' | translate}}
        </button>
        <button type="button" class="btn btn-default opx-btn-cancel" ui-sref="app.appman.datamodel">
            {{'common.entity.action.back' | translate}}
        </button>
    </div>
</form>
