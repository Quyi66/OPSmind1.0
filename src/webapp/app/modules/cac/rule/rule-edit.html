<div class="modal-header">
    <h4 class="modal-title">
        {{cacRuleEditVm.views.rule.id == null ? ('cac.rule.create' | translate) : ('cac.rule.edit' | translate)}}
    </h4>
    <button type="button" class="btn-close" data-dismiss="modal" aria-hidden="true"
            ng-click="cacRuleEditVm.views.cancel()">
        &times;
    </button>
</div>
<div class="modal-body">
    <form name="addRuleForm ">

        <div class="form-group">
            <label class="control-label">{{'common.entity.detail.name' | translate}} <span
                    class="cac-text-required">*</span></label>
            <input type="text" class="form-control" name="ruleName" ng-model="cacRuleEditVm.views.rule.ruleName"
                   required>
            <span class="cac-warning" ng-show="cacRuleEditVm.views.uniqueFlag">{{'common.entity.validation.unique' | translate}}</span>
        </div>
<!--        <div class="form-group">-->
<!--            <label class="control-label">标签 </label>-->
<!--            <select data-placeholder="请选择标签" multiple="" style="width: 100%" chosen=""-->
<!--                    ng-model="cacRuleEditVm.views.rule.label">-->
<!--                <option class="" value="{{label}}" ng-repeat="label in cacRuleEditVm.views.labels">-->
<!--                    {{label}}-->
<!--                </option>-->
<!--            </select>-->
<!--        </div>-->
        <div class="form-group cac-rule-expression">
            <label class="control-label ruleExpression">{{'cac.rule.detail.expr' | translate}} <span class="cac-text-required">*</span></label>
            <textarea ui-codemirror="cacRuleEditVm.views.option" class="cac-job-result-pre"
                      ng-model="cacRuleEditVm.views.rule.ruleExpression" required></textarea>
            <!--ng-pattern="/\$_?[a-zA-Z!(]+[%&,=?$|\.:{}\x22\w+-<>!()\u4e00-\u9fa5\/]*/g"-->
        </div>
        <div class="form-group cac-rule-applicability">
            <label class="control-label ruleExpression">
                <a ng-click="cacRuleEditVm.views.showApplicability=!cacRuleEditVm.views.showApplicability">{{'cac.rule.detail.applicability' | translate}}
                    <i class="fa fa-plus-square" ng-if="!cacRuleEditVm.views.showApplicability"></i>
                    <i class="fa fa-minus-square-o" ng-if="cacRuleEditVm.views.showApplicability"></i>
                </a>
            </label>
            <textarea ui-codemirror="cacRuleEditVm.views.option" class="cac-job-result-pre"
                      ng-model="cacRuleEditVm.views.rule.applicability"
                      ng-if="cacRuleEditVm.views.showApplicability"></textarea>
        </div>

        <!--<div class="form-group">
            <label class="col-sm-2 control-label">说  明  </label>
            <div class="col-sm-10">
                <textarea type="textarea" class="form-control" placeholder=""
                          ng-model="cacRuleEditVm.views.rule.description" row="3"></textarea>
            </div>
        </div>-->

    </form>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-primary opx-btn-ok" ng-click="cacRuleEditVm.views.save()"
            ng-disabled="addRuleForm.$invalid">{{'common.entity.acton.save' | translate}}
    </button>
    <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="cacRuleEditVm.views.cancel()">{{'common.entity.action.cancel' | translate}}
    </button>

</div>
