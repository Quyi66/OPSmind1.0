<div ng-if="!$ctrl.showResult" class="form op-smartform">
    <div class="form-group">
        <label class="control-label">{{ 'acm.common.filter.attr' | translate}}</label>
        <div class="form-control-wrapper">
            <select op-select class="form-select" ng-model="$ctrl.attrCode">
                <option value="IP">IP</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label">{{ 'acm.common.filter.match_data' | translate}}</label>
        <div class="form-control-wrapper">
            <textarea class="form-control" rows="10" ng-model="$ctrl.searchText"></textarea>
            <p class="help-block">{{ 'acm.common.filter.match_comment' | translate}}</p>
        </div>
    </div>
    <div class="from-group op-align-horizontal">
        <label class="control-label">{{ 'acm.common.filter.other_separator' | translate}}</label>
        <div class="form-control-wrapper">
            <div class="checkbox checkbox-inline" ng-repeat="delim in $ctrl.delimDefs track by $index">
                <input type="checkbox" id="aas-delim-{{$index}}" multiple
                       checkbox-model="$ctrl.searchDelims" checkbox-value="delim.value">
                <label for="aas-delim-{{$index}}">{{delim.label}}</label>
            </div>
        </div>
    </div>
    <div class="form-group">
        <button type="button" ng-click="$ctrl.doSearch()" class="btn btn-primary" ng-disabled="!$ctrl.searchText"><i
                class="fa fa-search"></i> {{ 'acm.common.filter.finding' | translate}}
        </button>
    </div>
</div>
<div ng-if="$ctrl.showResult">
    <div class="alert alert-danger mb-3" ng-if="$ctrl.notFounds.length>0">
        {{ 'acm.common.filter.data_not_found' | translate}}
        <ul class="mb-0 list list-unstyled">
            <li ng-repeat="item in $ctrl.notFounds">{{item}}</li>
        </ul>
    </div>
    <umd-data-view view-type="'selector'" the-data="$ctrl.searchResult" model-def="$ctrl.assetModel"></umd-data-view>
    <!--    <opx-datatable table-config="$ctrl.tableConfig">-->
    <button type="button" ng-click="$ctrl.showResult=false" class="btn btn-outline-primary mb-3">{{ 'acm.common.filter.enter_again' | translate}}</button>
    <!--    </opx-datatable>-->
</div>
