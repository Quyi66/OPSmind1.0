<div class="modal-header" xmlns="http://www.w3.org/1999/html">
    <h4 class="modal-title">{{'gfs.list.repo_settings' | translate}}</h4>
    <button type="button" class="btn-close" data-dismiss="modal" ng-click="$ctrl.cancel()">
    </button>
</div>
<div class="card-body">
    <div class="alert alert-success" style="margin-bottom: auto">
        <!--        <h4>-->
        <!--            <strong>{{'gfs.settings.current_repo' | translate}}<{{$ctrl.isExternal ? ('gfs.settings.isExternal' | translate) : ('gfs.settings.noExternal' | translate)}}>：</strong>-->
        <!--        </h4>-->
        <!--        <div>{{$ctrl.currentRepo}}</div>-->
        <p class="help-block ">
            <strong>{{'gfs.settings.init_repo_info' | translate}}</strong>
        </p>
    </div>
</div>
<div class="modal-body op-smartform">
    <!--    <p class="help-block ">-->
    <!--        <strong>{{'gfs.settings.init_repo_info' | translate}}</strong>-->
    <!--    </p>-->
    <div class="form-group">
        <!--        <label class="control-label">{{'gfs.settings.repo_auth_type' | translate}}</label>-->
        <label class="control-label"
               op-help-info="gfs.settings.repo_auth_type_info">{{'gfs.settings.repo_auth_type' | translate}}</label>
        <div class="form-control-wrapper" style="margin-top: 10px">
            <div class="radio radio-inline"><input type="radio" id="js-radio1" name="radios" value="https"
                                                   ng-checked="true"
                                                   ng-model="$ctrl.externalRepo.authType">&nbsp;<label
                    for="js-radio1">HTTPS</label></div>
            <div class="radio radio-inline"><input type="radio" id="js-radio2" name="radios" value="ssh"
                                                   ng-model="$ctrl.externalRepo.authType">&nbsp;<label
                    for="js-radio2">SSH</label></div>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label"
               op-help-info="gfs.basic.repo_name_desc">{{'gfs.basic.repo_name' | translate}}</label>
        <div class="form-control-wrapper">
            <input ng-disabled="!$ctrl.externalRepo.canEdit" type="text" min="0" max="60" class="form-control code" ng-model="$ctrl.externalRepo.repoName">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label"
               op-help-info="gfs.basic.auto_rsync_interval_desc">{{'gfs.basic.auto_rsync_interval' | translate}}</label>
        <div class="form-control-wrapper">
            <input type="number" min="0" max="60" class="form-control code" ng-model="$ctrl.externalRepo.jobInterval">
            <label class="control-label" style="margin-left: 5px">{{'gfs.basic.interval_unit' | translate}}</label>
        </div>
    </div>

    <div class="form-group" ng-if="$ctrl.externalRepo.authType === 'ssh'">
        <div class="form-group">
            <label class="control-label"
                   op-help-info="gfs.settings.repo_url_desc">{{'gfs.settings.repo_url' | translate}}</label>
            <div class="form-control-wrapper">
                <input ng-disabled="!$ctrl.externalRepo.canEdit" type="text" class="form-control code" ng-model="$ctrl.externalRepo.repoUrl">
            </div>
        </div>
        <div class="form-group">
            <div class="form-control-wrapper">{{'gfs.settings.key_file_path' | translate}}：~
                <strong>&nbsp;&nbsp;/&nbsp;&nbsp;{{$ctrl.externalRepo.authFile.name}}</strong>
            </div>
        </div>
        <div class="form-group">
            <div class="form-control-wrapper">
                <label class="btn btn-outline-primary">
                    <input type="file" ngf-select ngf-pattern="$ctrl.ngf.pattern"
                           ng-model="$ctrl.externalRepo.authFile" name="file" style="display:none;">
                    {{'gfs.settings.choose_key_file' | translate}}
                </label>
            </div>
        </div>
    </div>

    <div class="form-group" ng-if="$ctrl.externalRepo.authType === 'https'">
        <div class="form-group">
            <label class="control-label"
                   op-help-info="gfs.settings.repo_url_desc">{{'gfs.settings.repo_url' | translate}}</label>
            <div class="form-control-wrapper">
                <input ng-disabled="!$ctrl.externalRepo.canEdit" type="text" class="form-control code" ng-model="$ctrl.externalRepo.repoUrl">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label"
                   op-help-info="gfs.settings.repo_user_name_desc">{{'gfs.settings.repo_user_name' | translate}}</label>
            <div class="form-control-wrapper">
                <input type="text" class="form-control code" ng-model="$ctrl.externalRepo.authName">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label"
                   op-help-info="gfs.settings.repo_user_pass_desc">{{'gfs.settings.repo_user_pass' | translate}}</label>
            <div class="form-control-wrapper">
                <input type="password" class="form-control code" ng-model="$ctrl.externalRepo.authPass">
            </div>
        </div>
    </div>
</div>
<div class="modal-footer" style="display: unset">
    <!--    <button class="btn btn-danger" type="button" style="float: left" ng-click="$ctrl.resetSettingClose()">-->
    <!--        <i class="fa fa-fw fa-undo"></i>{{'gfs.settings.reset' | translate}}-->
    <!--    </button>-->
    <button class="btn btn-default opx-btn-cancel" type="button" ng-click="$ctrl.cancel()" style="float: right">
        {{'gfs.common.cancel' | translate}}
    </button>
    <button class="btn btn-primary opx-btn-ok" type="button" ng-click="$ctrl.saveSettingsClose()" style="float: right"
            ng-disabled="($ctrl.externalRepo.authType==='https' && !$ctrl.externalRepo.repoUrl)
             || ($ctrl.externalRepo.authType==='https' && !$ctrl.externalRepo.authName)
             || ($ctrl.externalRepo.authType==='https' && !$ctrl.externalRepo.authPass)
             || ($ctrl.externalRepo.authType==='ssh' && !$ctrl.externalRepo.repoUrl)
             || ($ctrl.externalRepo.authType==='ssh' && !$ctrl.externalRepo.authFile)">
        {{'gfs.common.sure' | translate}}
    </button>
</div>
