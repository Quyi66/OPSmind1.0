<div class="opx-layout-vflex">
    <nav class="navbar navbar-light">
        <div class="navbar-nav">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a ui-sref="app.cac.template.list({display:true})">{{'cac.index.template' | translate}}</a>
                </li>
                <li class="breadcrumb-item active opx-navbar-title">{{cacTeamConfigCtrlVm.views.templateName}}
                </li>
            </ol>
        </div>
    </nav>
    <div class="card-body">
        <div class="alert alert-success" role="alert">
            <button type="button" class="btn-close pull-right" data-dismiss="alert"></button>
            <div>
                <h4><strong>{{'cac.team.config_title' | translate}} </strong></h4>
                <div>{{'cac.team.config_msg' | translate}}</div>
            </div>
        </div>
        <div class="form-group">
            <div class="card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-3"  ng-repeat="teamData in cacTeamConfigCtrlVm.views.teamsInfoData" style="margin-top: 5px;">
                            <div class="checkbox checkbox-inline checkbox-primary">
                                <input type="checkbox" style="cursor: pointer;"
                                       ng-checked="teamData.isChecked"
                                       ng-click="cacTeamConfigCtrlVm.views.choice_data(teamData)" />
                                <label class="">{{teamData.teamName}}</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
