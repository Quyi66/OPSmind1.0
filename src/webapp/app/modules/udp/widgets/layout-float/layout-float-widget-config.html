<uib-tabset class="tab-container">
    <uib-tab>
        <uib-tab-heading><i class='fa fa-cog'></i> {{'udp.wc.tab.basic'|translate}}</uib-tab-heading>
        <div class="form-group">
            <label class="control-label col-sm-2" op-help-info="{{'udp.w.layout-float.config.id_desc'|translate}}">ID</label>
            <div class="col-sm-10 col-md-4">
                <input type="text" class="form-control" ng-model="uwProps.id">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2">{{'udp.w.layout-float.config.z_index'|translate}}</label>
            <div class="col-sm-4">
                <input type="number" class="form-control" ng-model="uwProps.display.zindex">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2">{{'udp.w.layout-float.config.operation'|translate}}</label>
            <div class="col-sm-10">
                <label class="checkbox-inline i-checks"><input type="checkbox" ng-model="uwProps.display.resizable"><i></i> {{'udp.w.layout-float.config.resizable'|translate}} </label>
                <label class="checkbox-inline i-checks"><input type="checkbox" ng-model="uwProps.display.draggable"><i></i> {{'udp.w.layout-float.config.draggable'|translate}} </label>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2">{{'udp.w.layout-float.config.max_width'|translate}}</label>
            <div class="col-sm-4">
                <input type="text" class="form-control" ng-model="uwProps.display.maxWidth">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2">{{'udp.w.layout-float.config.max_height'|translate}}</label>
            <div class="col-sm-4">
                <input type="text" class="form-control" ng-model="uwProps.display.maxHeight">
            </div>
        </div>
    </uib-tab>
    <uib-tab>
        <uib-tab-heading><i class='fa fa-paint-brush'></i> {{'udp.wc.tab.style'|translate}}</uib-tab-heading>
        <div class="form-group">
            <label class="control-label col-sm-2">{{'udp.w.layout-float.config.css'|translate}}</label>
            <div class="col-sm-10">
                <udp-css-editor the-model="uwProps.css"
                                options="{style:'dropdown',groups:'layout'}"></udp-css-editor>
            </div>
        </div>
    </uib-tab>
    <uib-tab heading="{{'udp.wc.tab.props'|translate}}">
        <pre>{{uwProps|json}}</pre>
    </uib-tab>
</uib-tabset>
