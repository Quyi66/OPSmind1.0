<style>
    .help-block {
        margin: 0px;
    }
</style>
<div class="modal-header">
    <h4 class="modal-title" id="myTeamLabel">
        <span data-translate="team.home.createTeam" ng-show="vm.team.id == null">Create Team</span>
        <span data-translate="team.home.editTeam" ng-show="vm.team.id != null">Edit Team</span>
    </h4>
    <button type="button" class="btn-close" data-dismiss="modal" aria-hidden="true" ng-click="vm.clear()">
        &times;
    </button>
</div>


<div class="modal-body">
    <form name="editForm" team="form" novalidate show-validation>
        <uib-tabset class="tab-container wrapper" active="1">
            <uib-tab index="1" heading="基本信息">
                <div class="form-group">
                    <label class="control-label" data-translate="team.name" for="field_name">Name</label>
                    <input type="text" class="form-control" name="name" id="field_name" required ng-minlength=1
                           ng-maxlength=50 ng-model="vm.team.name"/>
                    <p class="help-block">
                        <span ng-show="editForm.name.$error.required" data-translate="entity.validation.required">This field is required.</span>
                        <span ng-show="editForm.name.$error.maxlength" data-translate="entity.validation.maxlength"
                              translate-value-max="50">This field cannot be longer than 50 characters.</span>
                    </p>
                </div>
                <div class="form-group">
                    <label class="control-label" data-translate="team.code" for="field_code">Code</label>
                    <input type="text" class="form-control" name="code" id="field_code" ng-model="vm.team.code"/>
                </div>
                <div class="form-group">
                    <label class="control-label" data-translate="team.description"
                           for="field_description">Description</label>
                    <input type="text" class="form-control" name="description" id="field_description" required
                           ng-minlength=1
                           ng-maxlength=100 ng-model="vm.team.description"/>
                    <p class="help-block">
                        <span ng-show="editForm.description.$error.required"
                              data-translate="entity.validation.required">This field is required.</span>
                        <span ng-show="editForm.description.$error.maxlength"
                              data-translate="entity.validation.maxlength"
                              translate-value-max="100">This field cannot be longer than 100 characters.</span>
                    </p>
                </div>
            </uib-tab>
            <uib-tab index="2" heading="用户">
                <div class="row" ng-if="vm.users && vm.users.length > 0">
                    <span class="col-xs-6 col-sm-4 col-md-3" ng-repeat="user in vm.users">
                        <label class="i-checks">
                            <input type="checkbox"
                                   name="{{user.id}}"
                                   ng-checked="user.isChecked"
                                   ng-click="user.isChecked = !user.isChecked"/> <i></i>
                        </label>
                        <span class="">{{user.fullName}}</span>
                    </span>
                </div>
            </uib-tab>
        </uib-tabset>
    </form>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
        <span data-translate="common.action.cancel">Cancel</span>
    </button>
    <button type="button" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary" ng-click="vm.save()">
        <span data-translate="common.action.save">Save</span>
    </button>
</div>
