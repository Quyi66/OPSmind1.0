server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 启用gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

    # 启用Brotli压缩（如果nginx支持）
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 统一后端服务代理 - 修改IP地址为实际的后端服务器
    location ~ ^/(api|oplus-portal|oplus-upload|oplus-njs|oplus-ws|oplus-jobadm)/ {
        proxy_pass http://10.1.40.112:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # WebSocket支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 路径重写 - /oplus/base/ 映射到根目录
    location ^~ /oplus/base/ {
        rewrite ^/oplus/base/(.*)$ /$1 last;
    }

    # 路径重写 - /oplus/ 静态资源映射到根目录（排除后端API）
    location ^~ /oplus/ {
        rewrite ^/oplus/(.*)$ /$1 last;
    }

    # 路径重写 - /oplus-admin/ 映射到根目录
    location ^~ /oplus-admin/ {
        rewrite ^/oplus-admin/(.*)$ /$1 last;
    }

    # 静态资源缓存策略
    # CSS文件特殊处理
    location ~* \.css$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        add_header Content-Type "text/css";
        try_files $uri $uri.gz $uri.br =404;
    }

    # JavaScript文件
    location ~* \.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        add_header Content-Type "application/javascript";
        try_files $uri $uri.gz $uri.br =404;
    }

    # 字体文件
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # 图片资源
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 6M;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 根路径处理
    location / {
        try_files $uri $uri/ @fallback;
    }

    # SPA fallback - 对于找不到的文件，返回index.html
    location @fallback {
        rewrite ^.*$ /index.html last;
    }

    # 错误页面
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
