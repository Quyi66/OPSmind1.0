<nav class="navbar navbar-light bg-light b-b">
    <div class="navbar-header" style="width: 100%; padding-left: 20px;">
        <ol class="breadcrumb">
            <li>
                <a ui-sref="tenant" data-translate="sys_tenant.home.title">Tenant Management</a>
            </li>
            <li>
                <span data-translate="sys_tenant.detail.title">Tenant Detail</span>
            </li>
        </ol>
    </div>
</nav>
<div class="wrapper">
    <div class="card card-default">
        <div class="card-header">
            <h3 class="card-title">
                <span data-translate="sys_tenant.detail.title">Tenant Detail</span>
            </h3>
        </div>
        <div class="card-body">
            <uib-tabset class="tab-container row wrapper" active="1">
                <uib-tab index="1" heading="基本信息">
                    <div class="col-md-12">
                        <dl class="dl-horizontal jh-entity-details">
                            <dt><span>ID</span></dt>
                            <dd>
                                <span>{{vm.tenant.id}}</span>
                            </dd>
                            <dt><span data-translate="sys_tenant.name">Name</span></dt>
                            <dd>
                                <span>{{vm.tenant.name}}</span>
                            </dd>
                            <dt><span data-translate="sys_tenant.code">code</span></dt>
                            <dd>
                                <span>{{vm.tenant.code}}</span>
                            </dd>
                            <dt><span data-translate="sys_tenant.description">Description</span></dt>
                            <dd>
                                <span>{{vm.tenant.description}}</span>
                            </dd>
                        </dl>
                    </div>
                </uib-tab>
                <uib-tab index="2" heading="配置信息">
                    <div class="col-md-12">
                        <pre style="height:300px">{{vm.tenant.config}}</pre>
                    </div>
                </uib-tab>
        </div>
        <div class="card-footer text-right">
            <button type="button" ui-sref="tenant" class="btn btn-default">
                <span class="fa fa-arrow-left"></span>&nbsp;<span data-translate="common.action.back"> Back</span>
            </button>
        </div>
    </div>
</div>
