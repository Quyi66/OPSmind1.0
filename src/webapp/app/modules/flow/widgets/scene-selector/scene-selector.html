<div class="form-group">
    <label class="control-label">{{'udp.w.flow.process.select-scene' | translate}}</label>
    <div class="form-control-wrapper">
        <div class="input-group">
            <select op-select="{allowClear: true, placeholder: ('flow.scene.select_placeholder' | translate)}"
                    style="width:calc(100% - 2rem)" 
                    class="form-select" 
                    ng-model="$ctrl.theModel"
                    ng-disabled="$ctrl.disabled"
                    ng-options="scene.id as scene.name for scene in $ctrl.sceneList">
                <option></option>
            </select>
        </div>
    </div>
</div>
