<div style="background-color:#2C3E50;  background-position: center center;  background-repeat: no-repeat;  background-size: cover;__background-image: url('content/images/bg-oplus-01.jpg')"
     class="h-100 d-flex align-items-center justify-content-center login-page">
    <!--    <div class="login-cover">-->
    <!--    <img src="content/images/bg-2.png">-->
    <!--    </div>-->

    <div class="login-box-wrapper" style="padding-bottom:12rem;">
        <div style="padding: 1rem; background: rgba(0, 0, 0, 0.4); color: #ccc; width: 30rem; border-radius: 0.5rem;">
            <div class="mb-3">
                <img ng-src="{{loginMainVm.logoNavbarPath}}" height="48">
            </div>
            <op-login as-modal="false"></op-login>
        </div>
        <div class="text-light mt-3 text-center">
            <ul class="list list-unstyled list-inline">
                <li class="me-3">
                {{'common.system.browser_support'|translate}}
                </li>
                <li ng-repeat="(key,value) in loginMainVm.browsers" class="me-4" style="font-size:1.25em;"><i class="fab fa-{{key}}"></i>
                    {{value.version}}
                </li>
            </ul>
        </div>
    </div>
</div>

<style>
/* 登录页面样式修复 */
.login-page {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    overflow: hidden !important;
    z-index: 9999;
}

/* 隐藏body的滚动条 */
body:has(.login-page) {
    overflow: hidden !important;
}

/* 兼容性：如果:has不支持，使用类名 */
body.login-active {
    overflow: hidden !important;
}
</style>

<style>
/* 移除登录页面的白色边框 */
body .login-page {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 9999;
}

/* 隐藏主体容器的白色背景 */
.login-page ~ .opx-layout-vflex #master-body {
    background: none !important;
}
</style>

<style>
.login-page .form-control {
    border: none !important;
    border-radius: 0.25rem;
    background-color: rgba(255, 255, 255, 0.9);
}

.login-page .form-control:focus {
    border: none !important;
    box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    background-color: rgba(255, 255, 255, 1);
}
</style>
