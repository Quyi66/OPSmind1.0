<div class="opx-layout-vflex">
    <nav class="navbar navbar-light">
        <div class="opx-navbar-title">{{'cac.export.title' | translate}}</div>
    </nav>
    <div class="card-body">
        <div class="alert alert-success" role="alert">
            <button type="button" class="btn-close pull-right" data-dismiss="alert"></button>
            <div>
                <h4><strong>{{'cac.export.info_msg' | translate}} </strong></h4>
                <div>{{'cac.export.info_msg_two' | translate}}</div>
            </div>
        </div>
        <div class="form-group" ng-repeat="assetsModelType in vm.assetsModelTypes">
            <div class="card">
                <div class="card-header" style="line-height: 30px;background-color: #d1e7dd;margin: -1px;">
                    {{assetsModelType}}
                    <!--{{$index}}-->
                   <!-- {{'cac.export.model_title' | translate}}-->
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-3"  ng-repeat="assetModel in vm.assetsModelData[assetsModelType]" style="margin-top: 5px;">
                            <div class="checkbox checkbox-inline checkbox-primary">
                                <input type="checkbox"
                                       ng-checked="assetModel.isChecked"
                                       ng-click="vm.choice_data(assetModel)" />
                                <label class="">{{assetModel.title}}</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
