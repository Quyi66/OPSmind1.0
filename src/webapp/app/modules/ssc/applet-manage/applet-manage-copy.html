<form name="copyForm" ng-submit="$ctrl.confirmCopy()">
    <div class="modal-header">
        <h4 class="modal-title">{{'adm.content.copy_applet' | translate}}</h4>
        <button type="button" class="btn-close" data-dismiss="modal" aria-hidden="true"
                ng-click="$ctrl.clear()"></button>
    </div>
    <div class="modal-body">
        <div class="row">
            <div class="form-group">
                <label class="control-label">{{'ssc.applet.manage.copy.new.name' | translate}}</label>
                <div class="form-control-wrapper">
                    <input type="text" class="form-control" name="title" ng-model="$ctrl.applet.title" required>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label">{{'ssc.applet.manage.copy.new.code' | translate}} </label>
                <div class="form-control-wrapper">
                    <input type="text" class="form-control" name="name" ng-model="$ctrl.applet.name" required>
                </div>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="$ctrl.clear()">
            <span>{{'common.action.cancel'|translate}}</span>
        </button>
        <button type="submit" ng-disabled="copyForm.$invalid" class="btn btn-warning">
            <span>{{'common.action.copy'|translate}}</span>
        </button>
    </div>

</form>
