<fieldset ng-if="axisOptions.xAxis.enabled!==false">
    <legend>{{axisOptions.xAxis.name||'角度轴'}}</legend>
    <div>
        <div class="form-group">
            <label class="control-label col-sm-2">数据</label>
            <div class="col-sm-10">
                <udp-dsfield-selector the-model="theModel.xAxis" fields="fields"></udp-dsfield-selector>
            </div>
        </div>
    </div>
</fieldset>

<fieldset>
    <div class="pull-right" >
        <button type="button" class="btn btn-primary btn-sm" ng-click="addYAxis()"><i
                class="fa fa-plus-square"></i> 添加指标
        </button>
    </div>
    <legend>数据指标</legend>
    <div>
        <ul ui-sortable="sortableOptions" ng-model="theModel.yAxes" class="nav nav-pills">
            <!-- It seems adding class to li will make ui-sortable unstable -->
            <li ng-repeat="field in theModel.yAxes track by $index" style="height:32px;">
                    <span class="badge op-text-normal rounded-0"
                          ng-class="current.index === $index?'badge-info':'badge-default'">
                        <i ng-if="!field.field" class="fa fa-bolt"></i>
                        <a ng-click="selectYAxis($index)">{{ field.legend||label || field.field || '&nbsp;&nbsp;&nbsp;'}}</a>
                        <a ng-click="removeYAxis($index)" ></a>
                    </span></li>
        </ul>
    </div>
    <div ng-if="current.index>=0" class="bg-light lt p-2">
        <div class="form-group">
            <label class="control-label col-sm-2">图例名称</label>
            <div class="col-sm-4">
                <input class="form-control" ng-model="current.yAxis.legend"></div>
            <div class="col-sm-6">
                <div class="checkbox checkbox-inline"><input type="checkbox" class="form-control" id="wccm_yhidden"
                                                             ng-model="current.yAxis.hidden"><label for="wccm_yhidden">
                    默认不显示此字段</label></div>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2">数据</label>
            <div class="col-sm-10">
                <udp-dsfield-selector the-model="current.yAxis" fields="fields"></udp-dsfield-selector>
            </div>
        </div>
    </div>
</fieldset>
