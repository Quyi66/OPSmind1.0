<div class="form-group">
    <label class="col-sm-2 control-label" for="input_query" required>{{'dts.commons.search' | translate}} SQL *</label>
    <div class="col-sm-10">
        <textarea class="form-control code" rows="6" id="input_query" ng-model="dataset.query"></textarea>
    </div>
</div>
<div class="form-group">
    <label class="col-sm-2 control-label">{{'dts.commons.search_params' | translate}}</label>
    <div class="col-sm-10">
        <table class="table op-param-table">
            <thead>
            <tr>
                <th>{{'dts.commons.params' | translate}}
                    <button type="button" class="btn btn-sm btn-primary" ng-click="addQueryParam()"
                            title="{{'dts.commons.add_params' | translate}}"><i
                            class="fa fa-plus"></i></button>
                </th>
                <th>{{'dts.commons.desc' | translate}}</th>
                <th>{{'dts.commons.required' | translate}}</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr ng-repeat="param in dataset.params track by $index">
                <td><input type="text" class="form-control" ng-model="param.name"></td>
                <td><input type="text" class="form-control" ng-model="param.desc"></td>
                <td><label class="i-checks m-b-none"><input type="checkbox" name="display_panel"
                                                            ng-model="param.required"><i></i></label>
                </td>
                <td>
                    <button type="button" class="btn btn-default" ng-click="removeQueryParam($index)"><i
                            class="fa fa-times"></i></button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
