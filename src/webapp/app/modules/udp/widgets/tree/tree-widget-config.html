<uib-tabset class="tab-container">
    <uib-tab>
        <uib-tab-heading><i class='fa fa-database'></i> {{'udp.wc.tab.data' | translate}}</uib-tab-heading>
        <div class="form-group">
            <label class="control-label" for="usb_name"
                op-help-info="{{'udp.uinput.attrs.name_helpinfo'|translate}}">{{'udp.uinput.attrs.name'|translate}}</label>

            <div class="form-control-wrapper">
                <input class="form-control op-w-sm" ng-model="uwProps.name" id="usb_name">
            </div>
        </div>
        <uinput-setting-interaction props="uwProps"></uinput-setting-interaction>

        <udp-widget-config-dataset  props="uwProps.dataset" selected-ds="selectedDs"
                                    options="{allowServerPage:true,allowClientLimit:false}"></udp-widget-config-dataset>
    </uib-tab>
    <uib-tab>
        <uib-tab-heading><i class='fa fa-list-ul'></i> {{'udp.wc.tab.field' | translate}}</uib-tab-heading>
        <div class="form-group">
            <label class="control-label">
                <span op-help-info="{{'udp.w.tree.column.root_helpinfo' | translate}}">
                {{ 'udp.w.tree.column.root' | translate }}
            </label>
            <div class="form-control-wrapper">
                <input type="text" ng-model="uwProps.root" class="form-control op-w-sm" style="width:100%;" />
            </div>
        </div>
        <div class="form-group">
            <label class="control-label" for="f_expanded">{{'udp.w.tree.config.expanded'|translate}}</label>
            <div class="form-control-wrapper">
                <div class="checkbox checkbox-inline">
                    <input type="checkbox" id="f_expanded" ng-model="uwProps.expanded" />
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label">{{'udp.w.tree.column.type'|translate}}</label>
            <div class="form-control-wrapper">
                <select op-select class="form-select op-w-sm" style="width: 200px;" ng-model="uwProps.selector">
                    <option value="">{{'udp.w.tree.type.single'|translate}}</option>
                    <option value="multiple">{{'udp.w.tree.type.multiple'|translate}}</option>
                </select>
            </div>
        </div>

        <table class="table op-param-table">
            <tbody>
                <tr ng-repeat="param in ::attrs track by $index">
                    <td>
                        <select class="form-select" ng-model="uwProps.fields[param.name].position" ng-if="param.layouts"
                            ng-options="layout.key as 'udp.w.kpi.config.'+layout.key|translate for layout in param.layouts">
                        </select>
                    </td>
                    <td>{{::param.title}}</td>
                    <td>
                        <udp-dsfield-selector the-model="uwProps.fields[param.name]" fields="selectedDs.fields">
                        </udp-dsfield-selector>
                    </td>
                </tr>
            </tbody>
        </table>
    </uib-tab>
    <uib-tab>
        <uib-tab-heading><i class='fa fa-paint-brush'></i> {{'udp.wc.tab.style' | translate}}</uib-tab-heading>
        <udp-widget-config-display options="{palette:false}">
        </udp-widget-config-display>
    </uib-tab>
    <uib-tab heading="{{'udp.wc.tab.props'|translate}}">
        <udp-widget-props-viewer the-model="uwProps"></udp-widget-props-viewer>
    </uib-tab>
</uib-tabset>
